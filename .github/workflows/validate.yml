name: validate

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    manifests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v3
              with:
                  enable-cache: true
            - name: Validate manifests + SKILL.md frontmatter
              run: ./scripts/validate_manifests.py
